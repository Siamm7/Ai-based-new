<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Request Recruiter Access</title><link rel="stylesheet" href="style.css">
<style>
.access-wrap{max-width:720px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 8px 30px #0f172a12}
.access-wrap h1{margin-top:0}.access-wrap label{display:block;font-weight:600;margin:16px 0 6px}.access-wrap input,.access-wrap textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.access-wrap textarea{min-height:110px}.access-wrap button{margin-top:18px;padding:12px 20px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.status-box{padding:12px;border-radius:8px;background:#f1f5f9;margin:14px 0}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Job Recommendation System</span></a><nav class="main-nav"><a href="profile.html">My Profile</a><a href="jobs.html">Explore Jobs</a></nav></header>
<main class="access-wrap"><p class="section-kicker">RECRUITER ONBOARDING</p><h1>Request Recruiter Access</h1>
<p>Submit your company information. An administrator must review and approve your request before you can access recruiter tools.</p>
<div id="requestStatus" class="status-box">Checking your request status…</div>
<form id="recruiterRequestForm">
<label for="companyName">Company name *</label><input id="companyName" maxlength="150" required>
<label for="companyWebsite">Company website</label><input id="companyWebsite" type="url" placeholder="https://example.com">
<label for="contactPerson">Your name / position</label><input id="contactPerson" maxlength="150" placeholder="e.g. HR Manager">
<label for="requestDetails">Additional information</label><textarea id="requestDetails" maxlength="3000" placeholder="Briefly explain your role and why you need recruiter access."></textarea>
<button type="submit" id="requestSubmit">Submit for Admin Approval</button></form><p id="requestMessage" aria-live="polite"></p></main>
<script src="config.js"></script><script src="script.js"></script><script src="recruiter-request.js"></script></body></html>
