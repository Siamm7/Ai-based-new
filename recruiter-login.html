<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Recruiter Login</title><link rel="stylesheet" href="style.css">
<style>.portal-box{max-width:520px;margin:55px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 8px 30px #0f172a12}.portal-box label{display:block;font-weight:600;margin:16px 0 6px}.portal-box input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.portal-box button{margin-top:20px;padding:12px 20px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.portal-box button:disabled{opacity:.6}.portal-note{padding:12px;background:#eff6ff;border-radius:8px;margin:16px 0}</style></head><body>
<header class="site-header"><a class="brand" href="index.html">✦ Job Recommendation System</a><nav class="main-nav"><a href="login.html">Student Login</a><a href="recruiter-register.html">Recruiter Registration</a></nav></header>
<main class="page-shell"><section class="portal-box"><p class="section-kicker">EMPLOYER PORTAL</p><h1>Recruiter Login</h1><p>Sign in using your separately registered recruiter account.</p>
<div class="portal-note">Only recruiter accounts approved by the administrator can log in.</div>
<form id="recruiterLoginForm"><label for="recruiterEmail">Company email</label><input id="recruiterEmail" type="email" autocomplete="username" required><label for="recruiterPassword">Password</label><input id="recruiterPassword" type="password" autocomplete="current-password" required><button id="recruiterLoginButton" type="submit">Log in as Recruiter</button><p id="recruiterLoginMessage" aria-live="polite"></p></form>
<p>New recruiter? <a href="recruiter-register.html">Register your company account</a></p></section></main><script src="config.js"></script><script src="recruiter-login.js"></script></body></html>
